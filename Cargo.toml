[package]
name = "llmperf"
version = "0.9.1"
edition = "2024"
repository = "https://github.com/wheynelau/llmperf-rs"
description = "A benchmarking tool for large language model (LLM) inference performance."
build = "build.rs"

[lib]
name = "llmperf"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
futures = "0.3"
indicatif = { version = "0.18.4"}
log = "0.4.29"
rand = "0.10.2"
rand_distr = "0.6.0"
regex = "1.12.3"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
serde_with = "3.18.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "macros"] }
statrs = "0.19.0"
tokenizers = { version = "0.23.1", features = ["hf-hub", "http", "rustls-tls"] }
tokio = { version = "1.52.0", features = ["full"] }
zstd = "0.13"

[build-dependencies]
zstd = "0.13"

[[bench]]
name = "sampling_comparison"
harness = false

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
criterion = "0.8.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[profile.release]
lto = "thin"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
struct_field_names = "allow"
undocumented_unsafe_blocks = "warn"
cargo_common_metadata = "allow"
must_use_candidate = "allow"
cast_lossless = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
float_cmp = "allow"
