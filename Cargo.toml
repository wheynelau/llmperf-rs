[package]
name = "llmperf"
version = "0.2.0-beta.1"
edition = "2024"
repository = "https://github.com/wheynelau/llmperf-rs"
homepage = "https://github.com/wheynelau/llmperf-rs"
description = "A benchmarking tool for large language model (LLM) inference performance."

[lib]
name = "token_benchmark"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.43"
clap = { version = "4.5.56", features = ["derive"] }
env_logger = "0.11.8"
eventsource-client = "0.16.0"
futures = "0.3"
indicatif = { version = "0.18.3"}
log = "0.4.29"
rand = "0.9.2"
rand_distr = "0.5.1"
regex = "1.12.2"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
serde_with = "3.16.1"
statrs = "0.18.0"
tokenizers = { version = "0.22.2", features = ["hf-hub", "http", "rustls-tls"] }
tokio = { version = "1.49.0", features = ["full"] }
zstd = "0.13"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release]
lto = "fat"
codegen-units = 1
