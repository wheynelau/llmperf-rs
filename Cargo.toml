[package]
name = "llmperf"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/wheynelau/llmperf-rs"

[lib]
name = "token_benchmark"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
arrow = "57.0.0"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
eventsource-client = "0.15.1"
futures = "0.3"
indicatif = { version = "0.18.3", features = ["tokio"] }
log = "0.4.28"
parquet = "57.0.0"
rand = "0.9.2"
rand_distr = "0.5.1"
regex = "1.12.2"
reqwest = { version = "0.12.24", features = ["rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_arrow = { version = "0.13.7", features = ["arrow-57"] }
serde_json = "1.0.145"
serde_with = "3.16.0"
statrs = "0.18.0"
tokenizers = { version = "0.22.1", features = ["esaxx_fast", "hf-hub", "http", "rustls-tls"] }
tokio = { version = "1.48.0", features = ["full"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
