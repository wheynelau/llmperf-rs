# Reusable workflow for building and publishing Docker images
# Called by cargo-dist via post-announce-jobs

name: Docker Publish

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-22.04
    # Only run if this is an actual release (not a PR)
    if: ${{ fromJson(inputs.plan).announcement_tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from plan
        id: version
        run: |
          # Get version from the plan JSON (this is the release tag, e.g., "0.2.0-beta.4" or "v0.2.0")
          TAG='${{ fromJson(inputs.plan).announcement_tag }}'
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.tag }},enable=${{ !startsWith(steps.version.outputs.tag, 'v0.') && !startsWith(steps.version.outputs.tag, '0.') }}
            type=raw,value=latest,enable=${{ !fromJson(inputs.plan).announcement_is_prerelease }}

      - uses: actions/download-artifact@v4
        with:
          name: artifacts-build-local-x86_64-unknown-linux-gnu
          path: artifacts/amd64

      # Download the arm64 artifact into a folder named 'arm64'
      - uses: actions/download-artifact@v4
        with:
          name: artifacts-build-local-aarch64-unknown-linux-gnu
          path: artifacts/arm64

      - name: Extract and Normalize Artifacts
        run: |
          # Extract
          tar -xJf artifacts/amd64/*.tar.xz -C artifacts/amd64/
          tar -xJf artifacts/arm64/*.tar.xz -C artifacts/arm64/

          # Move
          mv artifacts/amd64/**/llmperf artifacts/amd64/llmperf
          mv artifacts/arm64/**/llmperf artifacts/arm64/llmperf

          # Insurance policy: Mark as executable on the runner host
          # This 'mode' is preserved by the Docker COPY command
          chmod +x artifacts/amd64/llmperf
          chmod +x artifacts/arm64/llmperf
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
